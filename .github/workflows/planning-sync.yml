name: Sync planning branch from main

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - planning
  workflow_dispatch:

jobs:
  sync:
    # For pull_request events, only run for PRs from this repo (not forks).
    # workflow_dispatch is unrestricted — GitHub already limits it to collaborators.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize: concurrent runs both try to merge main → planning and push,
    # producing non-fast-forward errors and potentially losing the AI-resolved
    # conflict commit. One at a time.
    concurrency:
      group: planning-sync
      cancel-in-progress: false

    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: planning
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge of main into planning
        id: merge
        run: |
          git fetch origin main
          if git merge --no-edit origin/main; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push if merge was clean
        if: steps.merge.outputs.result == 'clean'
        run: git push origin planning

      - name: Install Claude Code CLI and attempt AI conflict resolution
        if: steps.merge.outputs.result == 'conflict'
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve conflict with Claude Code
        if: steps.merge.outputs.result == 'conflict'
        id: resolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git merge --no-edit origin/main || true
          claude -p "Resolve the git merge conflicts in the working tree. \
              This is a merge of main into the planning branch. \
              The plan is split across multiple files under docs/plans/. \
              Preserve all content from both sides — do not discard any checkboxes, \
              issue annotations, or plan text from any plan file. Once resolved, stage \
              the affected files and complete the merge commit." \
            --model claude-haiku-4-5-20251001 \
            --allowedTools "Read,Edit,Bash(git:*)"
          if git diff --quiet && git diff --cached --quiet; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          else
            git commit --no-edit || git commit -m "chore: merge main into planning (AI-resolved conflict)"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push if AI resolved conflict
        if: steps.merge.outputs.result == 'conflict' && steps.resolve.outputs.resolved == 'true'
        run: git push origin planning

      - name: Open conflict-resolution PR if AI could not resolve
        if: steps.merge.outputs.result == 'conflict' && steps.resolve.outputs.resolved == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:main`,
              base: 'planning',
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'chore: sync main into planning (conflict — manual resolution required)',
                head: 'main',
                base: 'planning',
                body: [
                  'Automated sync of `main` into `planning` failed due to a merge conflict.',
                  'Claude was unable to resolve it automatically.',
                  '',
                  'Please resolve the conflict and merge this PR to keep the planning branch up to date.',
                ].join('\n'),
              });
            }
