name: Notify Planner on planning PR

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - planning

env:
  COPILOT_MODEL: claude-sonnet-4.6

jobs:
  planner-issues:
    # Only fires for plan/* → planning PRs from this repo
    if: |
      startsWith(github.head_ref, 'plan/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Serialize per PR: opened+reopened back-to-back must not both run the
    # planner agent and race on git push to the same plan/* branch.
    concurrency:
      group: planning-notify-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      # Pin to immutable SHA — mutable branch ref is a TOCTOU vector.
      # Branch tracking is restored afterwards so the agent can push annotations.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set branch tracking
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Planner agent (issue creation)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          copilot \
            --agent planner \
            --model $COPILOT_MODEL \
            --prompt "Process PR #${PR_NUMBER} (${PR_URL}) using the Issue creation workflow \
              from .github/agents/planner.agent.md. \
              Read the PR description to identify which phases or sections are targeted, \
              then read the relevant phase file(s) under docs/plans/ in the current \
              workspace and collect all unannotated checkboxes (those without a <!-- #N --> \
              annotation) in the targeted phases. Reconcile against existing open and \
              closed issues to avoid duplicates. Classify each issue as trivial or \
              non-trivial using the criteria in the agent file. Group or split tasks using \
              judgment to keep each issue independently reviewable and within 400 LOC. \
              Present draft issues to the human for approval, then create them and commit \
              inline <!-- #N --> annotations back to the relevant phase file(s) under \
              docs/plans/ on this PR branch." \
            --no-ask-user \
            --allow-all-tools
