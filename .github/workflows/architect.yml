name: Run Architect agent

on:
  issues:
    types: [labeled]

env:
  COPILOT_MODEL: claude-sonnet-4.6

jobs:
  design:
    # Only fire on the 'ready' label — trivial check happens inside.
    # Guard: 'ready' must be set by the scheduler bot, never by an agent or human.
    if: |
      github.event.label.name == 'ready' &&
      github.event.sender.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Verify issue author is trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # The Architect agent reads the issue title, body, and any existing
          # comments with --allow-all-tools and COPILOT_PAT in scope. Issue
          # bodies are attacker-controllable when the opener is not a member,
          # which makes them a prompt-injection vector even though the 'ready'
          # label itself is bot-applied. Require the opener to be a trusted
          # member; non-member issues must be curated/re-filed by a member
          # before the scheduler can promote them.
          ASSOC=$(gh api "repos/$GITHUB_REPOSITORY/issues/${ISSUE_NUMBER}" \
            --jq '.author_association')
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::error::Issue #${ISSUE_NUMBER} opener author_association is '${ASSOC}'. A member must curate and re-file external issues before Architect can process them."
              exit 1
              ;;
          esac

      - name: Check for trivial label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          HAS_TRIVIAL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '[.labels[].name] | any(. == "trivial")')
          echo "trivial=$HAS_TRIVIAL" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TRIVIAL" = "true" ]; then
            echo "Issue #${ISSUE_NUMBER} is trivial — Architect not required, Implementer will handle it."
          else
            echo "Issue #${ISSUE_NUMBER} is non-trivial — running Architect."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.trivial == 'false'
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        if: steps.check.outputs.trivial == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Copilot CLI
        if: steps.check.outputs.trivial == 'false'
        run: npm install -g @github/copilot

      - name: Run Architect agent
        if: steps.check.outputs.trivial == 'false'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          copilot \
            --agent architect \
            --model $COPILOT_MODEL \
            --prompt "Produce a technical design for issue #${ISSUE_NUMBER}. \
              Follow the full Architect workflow from .github/agents/architect.agent.md: \
              read the issue and every acceptance criterion, check all relevant ADRs in \
              docs/adr/ on main, search the codebase to identify every type, trait, and \
              module the change will touch, write a complete design (approach, module \
              changes, concrete Rust type and trait signatures, call flow, ADR impact). \
              Then: create the branch feat/<issue-number>-<slug> from main, commit the design \
              document(s) to docs/design/ and/or docs/adr/ as appropriate, open a draft \
              PR from that branch to main, post a design summary comment on issue \
              #${ISSUE_NUMBER} linking to the draft PR, remove the 'ready' label, and set \
              the 'awaiting-design-approval' label on the issue. \
              Do not write any .rs source files." \
            --no-ask-user \
            --allow-all-tools
