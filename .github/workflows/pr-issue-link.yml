name: Require Linked Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Require an explicit GitHub closing keyword. A bare '#42' in prose
          # (e.g. "thanks to PR #42") is not a linkage and is not accepted —
          # we want the issue to auto-close on merge, which only happens for
          # the documented closing keywords.
          # Closing keywords per GitHub: close, closes, closed, fix, fixes,
          # fixed, resolve, resolves, resolved.
          PATTERN='(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+|(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+https?://github\.com/[^/]+/[^/]+/issues/[0-9]+'

          if echo "$PR_BODY" | grep -iE "$PATTERN" > /dev/null; then
            echo "Issue reference found in PR body."
          elif echo "$PR_TITLE" | grep -iE "$PATTERN" > /dev/null; then
            echo "Issue reference found in PR title."
          else
            echo "ERROR: This PR must reference a linked issue using a GitHub closing keyword."
            echo "Use a phrase like 'Closes #123', 'Fixes #456', or 'Resolves https://github.com/owner/repo/issues/789' in the PR title or body."
            exit 1
          fi
