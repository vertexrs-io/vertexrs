name: Require Linked Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Accept any of: closes/fixes/resolves #N, or a plain #N reference, or a full GitHub issue URL
          PATTERN='(closes|fixes|resolves)[[:space:]]+#[0-9]+|#[0-9]+|github\.com/[^/]+/[^/]+/issues/[0-9]+'

          if echo "$PR_BODY" | grep -iE "$PATTERN" > /dev/null; then
            echo "Issue reference found in PR body."
          elif echo "$PR_TITLE" | grep -iE "$PATTERN" > /dev/null; then
            echo "Issue reference found in PR title."
          else
            echo "ERROR: This PR must reference a linked issue."
            echo "Include a reference such as 'Closes #123' or 'Fixes #456' in the PR title or body."
            exit 1
          fi
