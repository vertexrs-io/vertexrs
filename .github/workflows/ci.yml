name: CI

# Runs on every PR (any target branch) and after every merge to main.
# Kept intentionally lightweight — no benchmarks.
# See bench.yml for the benchmark gate (PRs targeting main only).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR / branch — a force-push or rapid
# follow-up commit shouldn't keep stale runs burning CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Single consolidated job — GitHub Actions rounds each job's runtime up to the
  # nearest minute when billing, so splitting fast gates across multiple runners
  # costs more minutes than running them sequentially on one.
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-llvm-cov,cargo-audit
      # Runs check → fmt → lint → test → coverage → audit (see Makefile.toml).
      # Coverage gate fails if line coverage drops below 90%.
      - run: cargo make ci
