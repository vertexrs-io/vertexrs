name: Architect design refinement

# Responds only to PR reviews — no issue_comment trigger so this workflow
# never runs in an untrusted-input privileged context (CodeQL CWE-829 alert 1).
# Issue-comment–triggered refinement is handled by the two-workflow pair:
#   architect-comment-receive.yml  (unprivileged triage)
#   architect-comment-run.yml      (privileged workflow_run runner)
on:
  pull_request_review:
    types: [submitted]

env:
  COPILOT_MODEL: claude-sonnet-4.6

jobs:
  # Triggered by a PR review on a draft feat/* PR — design feedback round
  refine-from-pr-review:
    if: |
      github.event.pull_request.draft == true &&
      startsWith(github.event.pull_request.head.ref, 'feat/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Pin to the immutable commit SHA, not the mutable branch name, to satisfy
      # CodeQL CWE-829 TOCTOU: the branch could be force-pushed between trigger and
      # checkout. We restore the branch tracking afterwards so the agent can push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set branch tracking
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Architect refinement
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          copilot \
            --agent architect \
            --model $COPILOT_MODEL \
            --prompt "PR #${PR_NUMBER} has received design feedback from ${REVIEWER}. \
              Read all unresolved review threads on PR #${PR_NUMBER}. \
              Follow the Architect refinement loop from .github/agents/architect.agent.md Step 5: \
              update docs/design/ and/or docs/adr/ on the current branch to address every piece \
              of feedback — refine signatures, call flows, dependency graphs, or level of detail \
              as requested. Record rejected alternatives. Update the open questions list. \
              Commit with message 'design: incorporate feedback from ${REVIEWER}'. \
              Post a reply comment on the linked issue summarising what changed, any trade-offs, \
              and any remaining open questions. \
              Do not write any .rs source files. Do not set design-approved." \
            --no-ask-user \
            --allow-all-tools
