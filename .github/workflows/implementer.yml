name: Run Implementer agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: number

env:
  COPILOT_MODEL: claude-sonnet-4.6

jobs:
  implement:
    # Fire on: workflow_dispatch, 'design-approved' label (non-trivial path),
    # or 'ready' label (trivial check happens inside).
    # Guards: 'design-approved' must be set by a human; 'ready' must be set by the
    # scheduler bot — prevents agent-applied labels from creating a runaway loop.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'design-approved' && github.event.sender.type == 'User') ||
      (github.event.label.name == 'ready' && github.event.sender.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # For 'ready' label: only proceed if the issue also has 'trivial'.
      # Non-trivial issues go through the Architect first and arrive here via 'design-approved'.
      - name: Check trigger condition
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass event context through env to avoid inline expression injection.
          # Label names can contain shell metacharacters; env vars are never word-split.
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LABEL_NAME" = "design-approved" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 'ready' label: only proceed when the issue is also labelled 'trivial'
          HAS_TRIVIAL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '[.labels[].name] | any(. == "trivial")')
          if [ "$HAS_TRIVIAL" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue is non-trivial — Architect must design it first."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.proceed == 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        if: steps.check.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Copilot CLI
        if: steps.check.outputs.proceed == 'true'
        run: npm install -g @github/copilot

      - name: Run Implementer agent
        if: steps.check.outputs.proceed == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
        run: |
          copilot \
            --agent implementer \
            --model $COPILOT_MODEL \
            --prompt "Implement GitHub issue #${ISSUE_NUMBER}. \
              Follow the full Implementer workflow from .github/agents/implementer.agent.md. \
              First read the issue in full — if there is an Architect design comment on the \
              issue, read it carefully and follow it; if not (trivial issue), determine the \
              approach yourself. Check all relevant ADRs in docs/adr/. \
              For non-trivial issues (triggered by design-approved), find the existing \
              feat/<issue-number>-<slug> branch the Architect created and check it out — do \
              NOT create a new branch from main. For trivial issues, create a new branch from \
              main: feat/<issue-number>-<slug>. Implement the acceptance criteria, \
              run cargo make ci and fix every failure. \
              For trivial issues, open a new PR from the branch to main. \
              For non-trivial issues, convert the existing draft PR to ready for review — \
              do NOT open a second PR to main. \
              Do not skip the CI gate. Do not merge the PR." \
            --no-ask-user \
            --allow-all-tools
