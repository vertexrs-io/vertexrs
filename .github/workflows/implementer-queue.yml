name: Implementer queue — promote next awaiting-agent issue

on:
  # Human just approved an issue — check immediately if a slot is free
  issues:
    types: [labeled]
  # A feat/* PR was closed (merged or abandoned) — a slot may have freed
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  promote:
    # Fire when: awaiting-agent label applied by a human, OR a feat/* PR targeting main is closed.
    # Guard: 'awaiting-agent' must be set by a human — prevents agents from self-queuing.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'awaiting-agent' &&
       github.event.sender.type == 'User') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feat/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Serialize all promotions: two concurrent triggers must not both
    # observe the same free slot and double-promote past the configured
    # concurrency limit.
    concurrency:
      group: implementer-queue
      cancel-in-progress: false

    steps:
      # Mint a short-lived installation token for the vertexrs-bot-scheduler
      # GitHub App. Using GITHUB_TOKEN here would suppress the downstream
      # 'ready' label event (GitHub blocks chain-triggers from GITHUB_TOKEN),
      # leaving implementer.yml unfired for trivial issues.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.SCHEDULER_APP_ID }}
          private-key: ${{ secrets.SCHEDULER_APP_PRIVATE_KEY }}

      - name: Count in-flight slots
        id: slots
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Pass through env to avoid inline expression injection in the run script.
          CONCURRENCY_LIMIT: ${{ vars.IMPLEMENTER_CONCURRENCY_LIMIT }}
        run: |
          # Default limit to 1 if the repo variable is not set
          LIMIT="${CONCURRENCY_LIMIT:-1}"

          # A slot is in use whenever an open issue holds any in-flight label.
          # Labels are mutually exclusive: agents/humans remove the old label before adding the next.
          #   ready              — trivial: Implementer fires automatically
          #   awaiting-design    — non-trivial: human must run the Architect locally
          #   design-approved    — non-trivial: Architect done, Implementer fires
          READY=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label 'ready' \
            --json number \
            --jq 'length')
          AWAITING_DESIGN=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label 'awaiting-design' \
            --json number \
            --jq 'length')
          APPROVED=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label 'design-approved' \
            --json number \
            --jq 'length')

          # Also count open feat/* PRs — a slot remains in use until the PR is closed
          OPEN_PRS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head 'feat/*' \
            --json number \
            --jq 'length')

          USED=$(( READY + AWAITING_DESIGN + APPROVED + OPEN_PRS ))
          echo "Slots in use: $USED / $LIMIT  (ready=$READY, awaiting-design=$AWAITING_DESIGN, design-approved=$APPROVED, open_prs=$OPEN_PRS)"
          echo "used=$USED" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Promote oldest awaiting-agent issue
        if: fromJSON(steps.slots.outputs.used) < fromJSON(steps.slots.outputs.limit)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Oldest issue = lowest issue number (FIFO)
          ISSUE=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label 'awaiting-agent' \
            --json number,labels \
            --jq 'sort_by(.number) | .[0] // empty')

          if [ -z "$ISSUE" ]; then
            echo "No awaiting-agent issues to promote."
            exit 0
          fi

          NUMBER=$(jq -r '.number' <<<"$ISSUE")
          IS_TRIVIAL=$(jq -r '[.labels[].name] | any(. == "trivial")' <<<"$ISSUE")

          # Trivial → 'ready' fires the Implementer directly.
          # Non-trivial → 'awaiting-design' signals a human to run the Architect locally;
          # the Implementer fires later, on 'design-approved'.
          if [ "$IS_TRIVIAL" = "true" ]; then
            NEXT_LABEL='ready'
          else
            NEXT_LABEL='awaiting-design'
          fi

          echo "Promoting issue #$NUMBER: awaiting-agent → $NEXT_LABEL"
          gh issue edit "$NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label 'awaiting-agent' \
            --add-label "$NEXT_LABEL"
