name: Bench

# Runs only after a PR merges to main. Compares the new main results against
# the previous main baseline via critcmp (fails on > 15% regression), then
# saves the new results as the updated baseline for the next merge.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,critcmp

      # Restore the previous main baseline so critcmp has something to diff against
      - name: Restore previous baseline
        id: restore-baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-main-${{ github.sha }}
          restore-keys: bench-baseline-main-

      # Run benchmarks — saves results to target/criterion/*/new/ without
      # touching the restored "main" baseline
      - name: Run benchmarks
        run: cargo make bench

      # Compare new/ against the restored main/ baseline; skip on first ever merge
      # (no baseline in cache yet). Fails the job if any benchmark regresses > 15%.
      - name: Compare against previous baseline (fail on > 15% regression)
        if: steps.restore-baseline.outputs.cache-matched-key != ''
        run: cargo make bench-cmp

      # Only reached if the comparison passed — promote new results to "main" baseline
      - name: Save new baseline
        run: cargo bench -- --save-baseline main

      - name: Cache new baseline
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-main-${{ github.sha }}
