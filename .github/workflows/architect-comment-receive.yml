name: Architect comment triage

# First half of the two-workflow pattern that fixes CodeQL CWE-829 alert 2
# (Untrusted Checkout TOCTOU on issue_comment).
#
# This workflow runs in an UNPRIVILEGED context: read-only permissions, no
# secrets beyond GITHUB_TOKEN (read scope), no code checkout.  It only
# validates the comment author and the issue label, resolves the linked PR
# branch to an immutable SHA via the GitHub API, then saves that metadata as
# an artifact.  Privileged operations (checkout + Copilot agent) are deferred
# to architect-comment-run.yml which is triggered by workflow_run.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  triage:
    if: |
      github.event.action == 'created' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Check for awaiting-design-approval label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          HAS_LABEL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '[.labels[].name] | any(. == "awaiting-design-approval")')
          echo "has_label=$HAS_LABEL" >> "$GITHUB_OUTPUT"

      # Gate-only check: confirm an eligible draft feat/<issue>-* PR exists in
      # this repo before we trigger the privileged runner. The runner re-fetches
      # the PR's branch and SHA from the API, so we don't persist them here.
      - name: Check linked draft PR exists
        id: pr
        if: steps.check.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COUNT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --draft \
            --json headRefName,headRepository \
            --jq "[.[] | select(.headRepository.nameWithOwner == \"$GITHUB_REPOSITORY\") | select(.headRefName | startswith(\"feat/${ISSUE_NUMBER}-\"))] | length")
          echo "exists=$([[ $COUNT -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save event data for privileged runner
        if: steps.check.outputs.has_label == 'true' && steps.pr.outputs.exists == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          mkdir -p ./event
          # Only integers are persisted — both are used solely as GitHub API
          # lookup keys in the privileged runner, never as shell input or
          # checkout refs. Branch, SHA, commenter, and comment body are all
          # re-fetched from the API in run.yml, so artifact tampering cannot
          # influence any privileged sink.
          # Write via env vars (not inline expressions) to keep shell safe from injection.
          printf '%s' "$ISSUE_NUMBER" > ./event/issue_number
          printf '%s' "$COMMENT_ID"   > ./event/comment_id

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_label == 'true' && steps.pr.outputs.exists == 'true'
        with:
          name: architect-event
          path: event/
          retention-days: 1
