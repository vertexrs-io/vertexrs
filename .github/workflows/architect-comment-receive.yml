name: Architect comment triage

# First half of the two-workflow pattern that fixes CodeQL CWE-829 alert 2
# (Untrusted Checkout TOCTOU on issue_comment).
#
# This workflow runs in an UNPRIVILEGED context: read-only permissions, no
# secrets beyond GITHUB_TOKEN (read scope), no code checkout.  It only
# validates the comment author and the issue label, resolves the linked PR
# branch to an immutable SHA via the GitHub API, then saves that metadata as
# an artifact.  Privileged operations (checkout + Copilot agent) are deferred
# to architect-comment-run.yml which is triggered by workflow_run.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  triage:
    if: |
      github.event.action == 'created' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Check for awaiting-design-approval label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          HAS_LABEL=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels \
            --jq '[.labels[].name] | any(. == "awaiting-design-approval")')
          echo "has_label=$HAS_LABEL" >> "$GITHUB_OUTPUT"

      - name: Find linked draft PR
        id: pr
        if: steps.check.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_JSON=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --draft \
            --json headRefName,headRefOid,headRepository \
            --jq "[.[] | select(.headRefName | startswith(\"feat/${ISSUE_NUMBER}-\")) | select(.headRepository.nameWithOwner == \"$GITHUB_REPOSITORY\")] | .[0]")
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName // empty')
          SHA=$(echo "$PR_JSON" | jq -r '.headRefOid // empty')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"

      - name: Save event data for privileged runner
        if: steps.check.outputs.has_label == 'true' && steps.pr.outputs.branch != ''
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          mkdir -p ./event
          # Write via env vars (not inline expressions) to keep shell safe from injection.
          printf '%s' "$ISSUE_NUMBER" > ./event/issue_number
          printf '%s' "$COMMENTER"    > ./event/commenter
          printf '%s' "$BRANCH"       > ./event/branch
          printf '%s' "$SHA"          > ./event/sha

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_label == 'true' && steps.pr.outputs.branch != ''
        with:
          name: architect-event
          path: event/
          retention-days: 1
