[workspace]
members = ["vertexrs", "vertexrs-macro"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vertexrs-io/vertexrs"

# ── External dependencies ─────────────────────────────────────────────────────
[workspace.dependencies]
arrow-array = "58"
arrow-buffer = "58"
criterion = { version = "0.8", features = ["html_reports"] }
half = "2"
polars = { version = "0.53", features = ["lazy"] }
proc-macro2 = "1"
quote = "1"
roaring = "0.11"
syn = { version = "2", features = ["full", "visit"] }
tikv-jemallocator = "0.6"

# ── Internal crates ───────────────────────────────────────────────────────────
# version must stay in sync with [workspace.package]
vertexrs-macro = { path = "vertexrs-macro", version = "0.1.0" }

# ── Lints ─────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# ── Profiles ──────────────────────────────────────────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 1
