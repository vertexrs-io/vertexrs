[package]
name    = "vertexrs"
version = "0.1.0"
edition = "2024"

[features]
default      = []
jemalloc     = ["dep:tikv-jemallocator"]
# Enable Polars as a dependency for benchmark comparison.
# Run with: cargo bench --features bench-polars
bench-polars = ["dep:polars"]

[dependencies]
vertexrs-macro    = { path = "../vertexrs-macro" }
arrow-buffer      = { workspace = true }
arrow-array       = { workspace = true }
half              = { workspace = true }
roaring           = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
# Optional: only compiled when bench-polars feature is enabled
polars            = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "column"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "incremental"
harness = false
